[project]
name = "statsbomb-analytics"
version = "0.1.0"
description = "Exploratory football analytics (xT, xG, scouting, similarity) with StatsBomb Open Data — academic/portfolio project."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "plotly>=5.24",
    "mplsoccer>=1.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0.3",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbomb_analytics"]

[tool.ruff]
line-length = 100
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
